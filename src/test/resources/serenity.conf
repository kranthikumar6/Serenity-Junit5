serenity.test.root = webtests

environment = grid

environments {

  grid {
    webdriver {
      driver = remote
      remote {
        url = "http://localhost:4444/wd/hub"
        driver = firefox
        os = Windows
      }
    }
  }

  local {
    webdriver {
      driver = chrome
      autodownload = true
    }
    capabilities {
      "goog:chromeOptions" {
        args = [
          "--start-maximized", "--remote-allow-origins=*", "--disable-notifications", "--disable-popup-blocking",
          "--ignore-certificate-errors"
        ]
        prefs {
          download {
            default_directory: "$TEMPDIR"
            prompt_for_download = false
            directory_upgrade = true
          }
        }
      }
    }
  }

  browserstack {
    tags = "not local"
    webdriver {
      driver = remote
      remote.url = "https://#{browserstack.user}:#{browserstack.key}@hub-cloud.browserstack.com/wd/hub"

      browserstack {
        os = "Windows"
        os_version = "11"
        browser = "Chrome"
        browser_version = "latest"
        resolution = "1280x1024"
      }
    }
  }
}